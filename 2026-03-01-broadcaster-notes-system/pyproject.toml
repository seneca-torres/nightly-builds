[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "broadcaster-notes"
version = "0.1.0"
description = "Convert plain text broadcaster notes into Obsidian-compatible markdown."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "OpenAI Codex" }]
dependencies = []

[project.scripts]
broadcaster-notes = "broadcaster_notes.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["broadcaster_notes*"]